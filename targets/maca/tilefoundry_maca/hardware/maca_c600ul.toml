[spec]
schema = "tilefoundry.cuda.device/v3"
kind = "device"
id = "maca.c600ul"

[compatibility]
architectures = ["maca.xcore1600"]

[facts.identity.name]
value = "c600ul"
unit = "name"
origin = "vendor"
source = "https://www.metax-tech.com/"
conditions = "MetaX C600UL analysis product"

[facts.compute.sm_count]
value = 32
unit = "count"
origin = "reference"
source = "maca-perf-model skill"
conditions = "32 APs"

[facts.compute.sm_clock_hz]
value = 1900000000
unit = "Hz"
origin = "estimated"
source = "C600U measured 1900 MHz (same xcore1600 family)"
conditions = "estimated from the C600U measurement; the 32-AP SKU is not on hand"

[facts.memory.hbm.capacity]
value = 77191970816
unit = "byte"
origin = "estimated"
source = "C600U measured 72 GiB class (same xcore1600 family); C600UL not on hand"
conditions = "not used by the roofline"

[facts.memory.hbm.owner]
value = "target"
unit = "name"
origin = "derived"
source = "mcDeepGemm docs/mega_mhc_theoretical_roofline_20261020.md"
conditions = "one HBM pool shared by all APs of this single-device target"

[facts.memory.hbm.bandwidth]
value = 2048000000000
unit = "byte/s"
origin = "reference"
source = "maca-perf-model skill: C600UL nominal HBM (2.048 TB/s)"
conditions = "Design peak (vendor nominal) for the 32-AP SKU. The C600U measured read+write envelope (1482.0 GB/s, same xcore1600 HBM) is the closest measured cross-check; C600UL itself was not measured."

[facts.memory.gmem.latency]
value = 800
unit = "ns"
origin = "estimated"
source = "C600U measured 800 ns pointer-chase (same xcore1600 family)"
conditions = "estimated from the C600U measurement; replace with a pointer-chase on this SKU when available"

[facts.memory.l2.capacity]
value = 2097152
unit = "byte"
origin = "reference"
source = "maca-perf-model skill: C600/C600U/C600UL L2 = 2 MiB"
conditions = "C600UL L2 = 2 MiB per device"

[facts.memory.l2.bandwidth]
status = "unavailable"
conditions = "MetaX publishes no static L2 bandwidth; the roofline uses HBM."

[facts.throughput.f32]
value = 24600000000000
unit = "flop/s"
origin = "derived"
source = "derived from AP count and an estimated 1.5 GHz clock"
conditions = "FFMA estimate at the estimated 1.5 GHz clock; the mega_mhc S1 is memory-bound so this peak is not binding"

[facts.throughput.f16]
value = 275250000000000
unit = "flop/s"
origin = "reference"
source = "maca-perf-model skill"
conditions = "16x16x16 MMA; 32 AP"

[facts.throughput.bf16]
value = 275250000000000
unit = "flop/s"
origin = "reference"
source = "maca-perf-model skill"
conditions = "Nominal 32-AP BF16 peak"

[facts.throughput.fp8e4m3]
value = 550500000000000
unit = "flop/s"
origin = "reference"
source = "maca-perf-model skill"
conditions = "Nominal 32-AP FP8 peak"

[facts.throughput.f4e2m1]
status = "unavailable"
conditions = "no FP4 MMA peak is published in the maca-perf-model skill; mcDeepGemm uses FP4 as a storage format."

[facts.service.integer]
value = 96000000000
unit = "op/s"
origin = "derived"
source = "64 integer results/clock/AP x 1.5 GHz"
conditions = "per-AP scalar envelope; the analysis multiplies by AP count. Same conservative 64/clock assumption as the CUDA target."

[facts.service.predicate]
value = 96000000000
unit = "op/s"
origin = "derived"
source = "64 predicate results/clock/AP x 1.5 GHz"
conditions = "same scalar envelope as integer"

[facts.service.select]
value = 96000000000
unit = "op/s"
origin = "derived"
source = "64 select results/clock/AP x 1.5 GHz"
conditions = "same scalar envelope as integer"

[facts.service.special]
value = 24000000000
unit = "op/s"
origin = "derived"
source = "16 special results/clock/AP x 1.5 GHz"
conditions = "rsqrt/exp-style special-function envelope; same 16/clock assumption as the CUDA target"
