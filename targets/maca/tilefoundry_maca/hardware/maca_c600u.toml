[spec]
schema = "tilefoundry.cuda.device/v3"
kind = "device"
id = "maca.c600u"

[compatibility]
architectures = ["maca.xcore1600"]

[facts.identity.name]
value = "c600u"
unit = "name"
origin = "vendor"
source = "https://www.metax-tech.com/"
conditions = "MetaX C600U (MXC600-U), 28 AP SKU"

[facts.compute.sm_count]
value = 28
unit = "count"
origin = "measured"
source = "torch.cuda.get_device_properties(0) on MXC600-U"
conditions = "multi_processor_count = 28 APs"

[facts.compute.sm_clock_hz]
value = 1900000000
unit = "Hz"
origin = "measured"
source = "mx-smi --show-clock on MXC600-U"
conditions = "XCORE clock reported as 1900 MHz; MC clock 1000 MHz"

[facts.memory.hbm.capacity]
value = 77191970816
unit = "byte"
origin = "measured"
source = "torch.cuda.get_device_properties(0) on MXC600-U"
conditions = "total_memory = 77,191,970,816 B (72 GiB class)"

[facts.memory.hbm.owner]
value = "target"
unit = "name"
origin = "derived"
source = "mcDeepGemm docs/mega_mhc_theoretical_roofline_20261020.md"
conditions = "one HBM pool shared by all APs of this single-device target"

[facts.memory.hbm.bandwidth]
value = 2048000000000
unit = "byte/s"
origin = "reference"
source = "maca-perf-model skill: C600U nominal HBM (2.048 TB/s; 16ch x 256b x 4.0 Gbps)"
conditions = "Design peak (vendor nominal). Measured envelopes (perf_data/bandwidth/20260818_MetaX_C600-U): read-only 1628.5, torch-add 1482.0, cub-transform 1513.7, copy 1380.1 GB/s; a mega_mhc 2 GiB copy probe measured 1183 GB/s in a session with a ~24% speed-mode flip. mxvs 0.0.1 (10 GB, die 0, 2026-10-27): read-only 1510-1534, kernel-copy 1003-1006 GB/s (a different tool and mode; recipe in tilefoundry spec maca/mxvs). The roofline denominator is the design peak."

[facts.memory.gmem.latency]
value = 800
unit = "ns"
origin = "measured"
source = "mcDeepGemm/docs/experiments/20261026_c600u_mega_mhc_tilelang_s3/probe_latency.py"
conditions = "pointer-chase on a 64 MiB random permutation: 769-822 ns/load at 1-4 chains/AP (28 APs); 8-16 chains/AP is the contended plateau. A 1 MiB permutation measures 308-323 ns for the L2-resident path."

[facts.memory.l2.capacity]
value = 2097152
unit = "byte"
origin = "reference"
source = "maca-perf-model skill: C600/C600U/C600UL L2 = 2 MiB"
conditions = "2 MiB per device"

[facts.memory.l2.bandwidth]
status = "unavailable"
conditions = "MetaX publishes no static L2 bandwidth; the roofline uses HBM."

[facts.throughput.f32]
value = 27238400000000
unit = "flop/s"
origin = "derived"
source = "28 AP x 256 FP32 lanes/AP x 2 FLOP x 1.9 GHz"
conditions = "FFMA estimate at the measured 1.9 GHz XCORE clock; the mega_mhc S1 is memory-bound so this peak is not binding"

[facts.throughput.f16]
value = 219050000000000
unit = "flop/s"
origin = "reference"
source = "maca-perf-model skill: C600U (28 AP) BF16/FP16 MMA peak"
conditions = "Nominal 16x16x16 MMA peak; a bare-MMA microbench measured 215.5 TF/s (98.4%) on C600U; mxvs 0.0.1 ops --blas (GEMM) measured 196.5 TFLOPS"

[facts.throughput.bf16]
value = 219050000000000
unit = "flop/s"
origin = "reference"
source = "maca-perf-model skill: C600U (28 AP) BF16/FP16 MMA peak"
conditions = "Nominal 16x16x16 MMA peak; a bare-MMA microbench measured 215.5 TF/s (98.4%) on C600U; mxvs 0.0.1 ops --blas (GEMM) measured 196.5 TFLOPS"

[facts.throughput.fp8e4m3]
value = 438100000000000
unit = "flop/s"
origin = "reference"
source = "maca-perf-model skill: C600U (28 AP) FP8 peak"
conditions = "Nominal native 16x16x32 FP8 MMA peak; a bare-MMA probe measured 415.7 TF/s (94.9%) on C600U; mxvs 0.0.1 has no fp8 model"

[facts.throughput.f4e2m1]
status = "unavailable"
conditions = "no FP4 MMA peak is published in the maca-perf-model skill; mcDeepGemm uses FP4 as a storage format."

[facts.service.integer]
value = 121600000000
unit = "op/s"
origin = "derived"
source = "64 integer results/clock/AP x 1.9 GHz"
conditions = "per-AP scalar envelope; the analysis multiplies by AP count. Same conservative 64/clock assumption as the CUDA target."

[facts.service.predicate]
value = 121600000000
unit = "op/s"
origin = "derived"
source = "64 predicate results/clock/AP x 1.9 GHz"
conditions = "same scalar envelope as integer"

[facts.service.select]
value = 121600000000
unit = "op/s"
origin = "derived"
source = "64 select results/clock/AP x 1.9 GHz"
conditions = "same scalar envelope as integer"

[facts.service.special]
value = 30400000000
unit = "op/s"
origin = "derived"
source = "16 special results/clock/AP x 1.9 GHz"
conditions = "rsqrt/exp-style special-function envelope; same 16/clock assumption as the CUDA target"
