[spec]
schema = "tilefoundry.cuda.architecture/v3"
kind = "architecture"
id = "maca.xcore1000"

[facts.identity.name]
value = "xcore1000"
unit = "name"
origin = "vendor"
source = "https://www.metax-tech.com/"
conditions = "MACA architecture tag for C500 (mcTlassEx target_replace.sh)"

[facts.capabilities]
value = ["mma.16x16x16.bf16", "mma.16x16x16.i8", "ldg.b128.bsm", "barrier.inst", "barrier.warp", "shfl", "mov.shfl"]
unit = "name"
origin = "reference"
source = "mcDeepGemm csrc/jit_kernels/impls/bf16_mega_mhc_maca_c.hpp and maca_tile/builtin"
conditions = "instruction families the C500 kernels select; names are this target's vocabulary, not vendor PTX names"

[facts.instruction.compute_dtypes]
value = ["f32", "f16", "bf16"]
unit = "name"
origin = "reference"
source = "mcDeepGemm docs/mega_mhc_theoretical_roofline_20261020.md"
conditions = "C500 has no native FP8 MMA (FP8 is emulated); f4e2m1 is a storage format in mcDeepGemm, not a compute dtype"

[facts.compute.max_threads_per_cta]
value = 2048
unit = "thread"
origin = "reference"
source = "maca_kernel_doctor XCORE1000 constants"
conditions = "common MACA limit; XCORE1000 kernel doctor uses the same 2048 threads per AP"

[facts.compute.max_threads_per_warp]
value = 64
unit = "thread"
origin = "reference"
source = "mcDeepGemm docs/mega_mhc_maca_c_occupancy_20261017.md; maca_kernel_doctor XCORE1000 constants"
conditions = "MACA wave width is 64 lanes"

[facts.compute.max_warps_per_cta]
value = 32
unit = "count"
origin = "derived"
source = "maca_kernel_doctor XCORE1000 constants"
conditions = "2048 threads per AP divided by the 64-lane wave"

[facts.compute.max_resident_ctas_per_sm]
value = 8
unit = "count"
origin = "derived"
source = "maca_kernel_doctor XCORE1000 constants"
conditions = "2048 threads per AP divided by a 256-thread CTA; resource usage lowers it"

[facts.memory.shared.per_sm]
value = 65536
unit = "byte"
origin = "reference"
source = "maca_kernel_doctor XCORE1000 constants"
conditions = "64 KiB shared memory per AP on XCORE1000"

[facts.memory.shared.per_cta]
value = 65536
unit = "byte"
origin = "reference"
source = "maca_kernel_doctor XCORE1000 constants"
conditions = "64 KiB shared memory per CTA on XCORE1000"

[facts.memory.shared.owner]
value = "cta"
unit = "name"
origin = "reference"
source = "mcDeepGemm docs/mega_mhc_maca_c_occupancy_20261017.md; maca_kernel_doctor XCORE1000 constants"
conditions = "dynamic shared memory is requested per CTA"

[facts.memory.unified_l1_shared.per_sm]
value = 65536
unit = "byte"
origin = "reference"
source = "maca_kernel_doctor XCORE1000 constants"
conditions = "64 KiB shared-memory block per AP; no separate L1 capacity is published"

[facts.memory.shared.bandwidth]
value = 128
unit = "byte/clock/sm"
origin = "estimated"
source = "structural 32-bank x 4-byte model"
conditions = "not measured on C600U; stated so the analysis can price shared-memory traffic. Replace with a measured value when available."

[facts.memory.register.per_sm]
value = 131072
unit = "register"
origin = "reference"
source = "maca_kernel_doctor XCORE1000 constants"
conditions = "regs_per_multiprocessor = 131072 32-bit registers per AP"

[facts.memory.register.owner]
value = "thread"
unit = "name"
origin = "reference"
source = "mcDeepGemm docs/mega_mhc_maca_c_occupancy_20261017.md; maca_kernel_doctor XCORE1000 constants"
conditions = "automatic variables reside in a thread's private registers"

[facts.memory.register.bandwidth]
status = "unavailable"
conditions = "MACA publishes no static register-file bandwidth to use for a roofline."

[facts.memory.tensor.per_cta]
status = "unavailable"
conditions = "C600U has no separate tensor-memory store; MMA accumulates in the register file."

[facts.memory.tensor.owner]
value = "cta"
unit = "name"
origin = "derived"
source = "mcDeepGemm docs/mega_mhc_maca_c_occupancy_20261017.md; maca_kernel_doctor XCORE1000 constants"
conditions = "where tensor memory exists its allocation is CTA-scoped; C600U records no capacity"
