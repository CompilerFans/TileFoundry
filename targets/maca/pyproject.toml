[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "tilefoundry-maca"
dynamic = ["version", "dependencies"]
description = "MACA (MetaX C500/C600/C600U/C600UL) analysis targets for TileFoundry."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

[project.entry-points."tilefoundry.targets"]
maca = "tilefoundry_maca.maca"

[tool.setuptools_scm]
root = "../.."

[tool.setuptools.packages.find]
include = ["tilefoundry_maca", "tilefoundry_maca.*"]

[tool.setuptools.package-data]
"tilefoundry_maca.hardware" = ["*.toml"]
"tilefoundry_maca.maca" = ["docs/spec/*.md", "docs/mxvs/*/*.json", "models/*.py"]
