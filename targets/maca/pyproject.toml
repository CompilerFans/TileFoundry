[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "tilefoundry-maca"
version = "0.1.0"
description = "MACA (MetaX C500/C600/C600U) analysis targets for TileFoundry."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["tilefoundry", "tilefoundry-nvidia"]

[project.entry-points."tilefoundry.targets"]
maca = "tilefoundry_maca.maca"


[tool.setuptools.packages.find]
include = ["tilefoundry_maca", "tilefoundry_maca.*"]

[tool.setuptools.package-data]
"tilefoundry_maca.hardware" = ["*.toml"]
"tilefoundry_maca.maca" = ["docs/spec/*.md", "models/*.py"]
